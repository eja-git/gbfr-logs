[package]
name = "injector"
version = "0.1.0"
edition = "2021"

# Deliberately minimal: no tauri, no wry, no WebView2 anywhere in this
# dependency graph. This binary's only job is to find the game process and
# inject hook.dll — no GUI, so it's immune to the Wine/DirectComposition
# crash that blocks the Tauri GUI.
[dependencies]
anyhow = "1.0"
dll-syringe = "0.15.2"
env_logger = "0.11"
log = "^0.4"
